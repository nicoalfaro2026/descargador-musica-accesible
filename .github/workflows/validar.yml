name: Validar código y traducciones

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar traducciones
        run: python tools/verificar_traducciones.py

      - name: Verificar textos de interfaz
        run: python tools/verificar_textos_interfaz.py

      - name: Verificar sintaxis Python
        run: python -m compileall -q .
